name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# WHAT THIS WORKFLOW DOES AND DOES NOT COVER
#
# Covered: the whole pure-Go surface. Build, vet and gofmt; every unit test,
# including the module-level tests that replay the checked-in C-generated
# vectors in testdata/vectors (MQ coder, DWT, T1, HT, MCT, PI, T2, JP2 boxes,
# ...) bit-for-bit; the public-API tests; the fuzz targets' seed corpora; and
# the same on a native arm64 runner, which is what actually backs the
# "bit-exact on every GOARCH" claim (see the README section of that name) —
# the float vectors are replayed by a compiler that contracts x*y+z into an
# FMA unless the rounding barriers hold.
#
# Also covered, by the oracle-bounds job: the documented error bound against a
# from-source OpenJPEG 2.5.4 built natively on amd64 AND arm64 (Linux and
# macOS). It generates codestreams with both encoders and requires the two
# decoders to agree exactly on the reversible 5/3 path and within one unit on
# the irreversible 9/7 path — the bound the README documents and issue #14
# measured. No corpus is needed; the gate is self-generating.
#
# NOT covered: the byte-identity gates in oracletest/. They need a locally
# built OpenJPEG ("the oracle") plus the openjpeg-data corpus under oracle/,
# which is gitignored, so oracletest.Require() skips them here. Byte-for-byte
# parity is defined against one specific C build: OpenJPEG compiled
# -O3 -ffast-math, whose gcc reassociations several exactness results (the ICT
# green term in internal/mct, the forward-ICT grouping and hoisted quantizer
# division on the encode side) deliberately reproduce. A CI-built oracle can
# round 1 ULP differently — which is exactly why the oracle-bounds job asserts
# the bounded comparison instead of equality. The curated pass/error lists are
# likewise tied to the exact corpus contents. Running the byte-identity gates
# remains a maintainer step on a machine with oracle/ built:
#     go test ./oracletest/
# and it is required before merging anything that touches the codec.

jobs:
  test:
    name: test (amd64, go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod declares go 1.25 and must keep building with it; 'stable'
        # catches breakage from newer toolchains.
        go: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^oracle/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: fuzz seed corpora
        # Runs each fuzz target over its f.Add seeds and testdata/fuzz corpus as
        # ordinary test cases (no fuzzing engine, no time budget). This is the
        # regression net for the crashers previously found by long fuzz runs.
        run: go test -run 'Fuzz' ./...

  arm64:
    name: test (arm64 native, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Both native arm64 runners. No test accommodations are needed off
        # linux/amd64: the differential gates self-skip without a local
        # oracle/ build, and everything else is pure Go with no platform
        # assumptions. The C oracle itself is not architecture-stable on the
        # irreversible 9/7 path, but the divergence is bounded — ±1 unit,
        # matching ISO/IEC 15444-4's maximum-error conformance model (README
        # "Bit-exactness across architectures"). The exact-equality gates
        # therefore pin an amd64 oracle and these jobs replay its frozen
        # vectors; the oracle-bounds job below enforces the ±1 bound against
        # natively built oracles on every platform.
        os: [ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: build
        run: go build ./...

      - name: test
        # gc contracts x*y+z into a single-rounding FMA on arm64 but never on
        # amd64, so this job is what proves the explicit float32()/float64()
        # rounding barriers in the 9/7 DWT, the MCT and the colour conversions
        # still reproduce the C vectors bit-for-bit off amd64.
        run: go test ./...

  oracle-bounds:
    name: oracle bounds (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # amd64 plus both arm64 runners: the arm64 legs are where the C
        # library's own 9/7 rounding diverges from amd64 builds (issue #14),
        # so they are the ones that make the ±1 bound load-bearing rather
        # than trivially satisfied.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: cache oracle build
        id: oracle-cache
        uses: actions/cache@v6
        with:
          path: oracle-ci/openjpeg/build/bin
          key: openjpeg-2.5.4-${{ runner.os }}-${{ runner.arch }}

      - name: build OpenJPEG 2.5.4 from source
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        # A plain native Release build — deliberately NOT the -ffast-math
        # amd64 build the byte-identity gates pin. The bounds gate asserts
        # the documented tolerance, so any conforming build is a valid
        # reference; static linking avoids library-path differences between
        # the runners.
        run: |
          curl -sSL https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.4.tar.gz | tar xz
          cmake -S openjpeg-2.5.4 -B oracle-ci/openjpeg/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF
          cmake --build oracle-ci/openjpeg/build --target opj_compress opj_decompress -j 4

      - name: bounds gate
        # Exact agreement on the reversible 5/3 path, within one unit on the
        # irreversible 9/7 path, over streams from both encoders. See
        # oracletest/bounds_gate_test.go.
        run: |
          GOPENJPEG_ORACLE="$PWD/oracle-ci" \
            go test ./oracletest/ -run 'TestOracleDecodeBounds' -count=1 -v

  cross:
    name: cross-compile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: vet for arm64
        run: GOARCH=arm64 GOOS=linux go vet ./...

      - name: no FMA contraction in the float kernels
        # Every GOARCH on which gc contracts x*y+z. The float pipeline wraps each
        # product feeding an add in an explicit conversion, which the Go spec
        # defines as a rounding step and hence an FMA barrier; if one is ever
        # dropped, a floating-point multiply-add mnemonic reappears here. The
        # pattern matches only FP forms (FMADD/FMSUB/FNMADD/FNMSUB and the
        # s390x/ppc64 vector spellings) — integer MADD is exact and expected.
        run: |
          status=0
          for arch in arm64 ppc64le s390x riscv64 loong64; do
            hits=$(GOARCH=$arch GOOS=linux go build -gcflags=-S \
                     ./internal/dwt ./internal/mct . 2>&1 \
                   | grep -E '\b(F[A-Z]*M(ADD|SUB)|WFM(ADD|SUB)|XS[A-Z]*M(ADD|SUB))' || true)
            if [ -n "$hits" ]; then
              echo "FMA contraction on GOARCH=$arch:"
              echo "$hits"
              status=1
            fi
          done
          exit $status
